# =============================================================================================
# Block model QA/QC: project settings
# =============================================================================================
# Copy this file for each project, give it a new name (for example my_project.yaml) and change
# the values. Lines starting with # are notes and are ignored.
#
# These are the only settings most projects need. Everything else has a sensible default. The
# full list, with explanations, is in advanced_settings_reference.yaml in this folder.
#
# Writing paths: use forward slashes, also on Windows, for example
#   C:/Projects/MRE/block_model.csv
# A path that does not start with a drive letter is read from the folder this file is in.

project_name: "Example Project 2026 MRE"

# metric:   coordinates and block sizes in metres, density in t/m3 (same number as the
#           specific gravity), tonnage in tonnes, precious metals in g/t
# imperial: coordinates and block sizes in feet, density in short tons per cubic foot,
#           tonnage in short tons, precious metals in oz/ton (troy ounces per short ton)
units: metric

paths:
  block_model_csv: ../data/block_model.csv   # the block model export (CSV file)
  output_dir: ../qaqc_outputs/                # the report and other results are written here

# Domain codes that are waste or air. Air blocks are only used in the grid checks.
domains:
  waste_codes: ["0", "99", "999", "WASTE", "OVB", "UNMIN"]
  air_codes: ["AIR"]

# Which classification codes in the file mean what. A code that is not listed is counted
# as Unclassified and reported, so you can add it here.
# Exploration Target (ET) blocks are shown as their own class. They are not part of the
# resource total and are not flagged as "unclassified but mineralised".
classification:
  measured: ["1", "MEAS", "MEASURED"]
  indicated: ["2", "IND", "INDICATED"]
  inferred: ["3", "INF", "INFERRED"]
  exploration_target: ["4", "ET", "EXPLORATION TARGET"]
  unclassified: ["0", "99", "UNCLASS", "UNCLASSIFIED", "NONE"]

# One line per element. Elements found in the file but not listed here are still checked,
# just without a ceiling or cutoff.
#   column:  the grade column in the file. Leave it out and the tool finds it from the
#            column names (it stops and asks if two columns could be the grade).
#   unit:    pct, ppm, ppb, gpt (g/t) or opt (oz/ton). Leave it out and the tool reads it
#            from the column name (for example CU_PCT, AU_GPT, AU_OPT).
#   ceiling: the highest believable grade. Blocks above it are flagged.
#   cutoff:  the grade that counts as mineralised. Waste blocks and Unclassified blocks
#            at or above it are flagged (Exploration Target blocks are not).
#   ceiling and cutoff are in the element's unit.
elements:
  cu: {unit: pct, ceiling: 34.6, cutoff: 0.5}
  au: {unit: gpt, ceiling: 500, cutoff: 0.5}
  # Examples:
  # ni: {column: NI_OK_FINAL, unit: pct, ceiling: 36, cutoff: 0.4}
  # au: {column: AU_OPT, unit: opt, ceiling: 15, cutoff: 0.015}     (imperial)

# Allowed density range. Blocks outside it, or with no density, are flagged.
# metric: t/m3 (default 1.5 to 5.5); imperial: short tons/ft3 (default 0.045 to 0.175).
density:
  range: [1.5, 5.5]

# Your classification criteria, checked against the estimation details in the model (search
# pass, number of samples and holes, slope of regression, kriging efficiency). Measured and
# Indicated blocks that fail any limit are flagged.
# REPLACE THESE EXAMPLE VALUES with the project's own criteria. To skip one, set it to null.
support:
  measured: {nholes_min: 3, nsamples_min: 8, slope_reg_min: 0.80, kriging_eff_min: 0.50, max_pass: 1}
  indicated: {nholes_min: 2, nsamples_min: 4, slope_reg_min: 0.50, kriging_eff_min: 0.30, max_pass: 2}

# Rebuild the resource statement above a cutoff, to compare with the published one.
# Example: resource_cutoff: {element: cu, value: 0.3}   (value in the element's unit)
# null = skip.
reporting:
  resource_cutoff: null

# If the tool picks the wrong column, or cannot decide, name the column here.
# It tells you the exact line to add when this is needed. Example:
#   column_overrides:
#     domain: "EST_DOMAIN"
#     sg: "DENSITY_FINAL"
column_overrides: {}
